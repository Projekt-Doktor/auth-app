<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f4f5; margin: 0; padding: 40px 16px; color: #111; }
    .card { background: #fff; max-width: 480px; margin: 0 auto; border-radius: 8px; padding: 40px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #555; line-height: 1.6; margin: 0 0 24px; }
    .btn { display: inline-block; padding: 12px 28px; background: #111; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .note { font-size: 12px; color: #888; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to your account</h1>
    <p>Click the button below to sign in. This link expires in 15&nbsp;minutes and can only be used once.</p>
    <a href="{{MAGIC_LINK}}" class="btn">Sign in</a>
    <p class="note">If you did not request this email, you can safely ignore it — your account is not at risk.</p>
    <p class="note">Or paste this link into your browser:<br/><a href="{{MAGIC_LINK}}" style="color:#555;word-break:break-all;">{{MAGIC_LINK}}</a></p>
  </div>
</body>
</html>
